<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Doğrulama Kodu -->
    <meta name="google-site-verification" content="OArqvvslfpSel8d40VEN0Dgc5xB4xRpsqlqCcS1pX5k" />

    <!-- Google ve Arama Motorları İçin SEO Etiketleri -->
    <title>Çölyak Güvenli Gıda ve İlaç Arama Rehberi</title>
    <meta name="description" content="Çölyak hastaları için güvenli gıda ve ilaç sorgulama rehberi. Binlerce ürünü ve ilacı tek arama çubuğundan anında güvenle sorgulayın.">
    <meta name="keywords" content="çölyak, glutenli, glutensiz gıda, güvenli ilaç, çölyak rehberi, gıda arama">
    <meta name="author" content="Çölyak Arama Asistanı">

    <!-- Tailwind CSS ile modern ve şık tasarım -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Üst Başlık -->
    <header class="bg-slate-900 shadow-sm py-6 px-4 text-white">
        <div class="max-w-2xl mx-auto text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-emerald-400">Çölyak Güvenli Yaşam Rehberi</h1>
            <p class="text-sm text-slate-300 mt-1">Gıda ve ilaçları tek arama çubuğundan güvenle sorgulayın</p>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-2xl mx-auto w-full px-4 py-8 flex-grow">
        
        <!-- Arama Çubuğu -->
        <div class="relative mb-6">
            <input 
                type="text" 
                id="aramaInput" 
                placeholder="Ürün veya ilaç adı yazın (Örn: Süt, Parol)..." 
                class="w-full px-4 py-4 pl-12 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-base bg-white transition-all"
                autofocus
            >
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-lg">
                🔍
            </span>
        </div>

        <!-- Durum Bilgisi -->
        <div id="durumMetni" class="text-center text-sm text-slate-500 mb-6">
            Veriler yükleniyor, lütfen bekleyin...
        </div>

        <!-- Sonuçların Listelendiği Alan -->
        <div id="sonucListesi" class="space-y-3"></div>

    </main>

    <!-- Alt Bilgi -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 mt-auto bg-white">
        GitHub Pages üzerinde barındırılmaktadır • Güvenli Arama Asistanı
    </footer>

    <!-- JavaScript Optimizasyon ve Arama Mantığı -->
    <script>
        let tumVeriler = [];

        async function verileriYukle() {
            const durumEl = document.getElementById("durumMetni");
            try {
                const timestamp = new Date().getTime();
                
                const [ilacResponse, gidaResponse] = await Promise.all([
                    fetch('ayse.csv?v=' + timestamp),
                    fetch('urunler.csv?v=' + timestamp).catch(() => null)
                ]);

                let birlesikVeri = [];

                if (ilacResponse && ilacResponse.ok) {
                    const ilacText = await ilacResponse.text();
                    birlesikVeri = birlesikVeri.concat(ilacText.split(/\r?\n/));
                }

                if (gidaResponse && gidaResponse.ok) {
                    const gidaText = await gidaResponse.text();
                    birlesikVeri = birlesikVeri.concat(gidaText.split(/\r?\n/));
                }

                tumVeriler = birlesikVeri
                    .filter(satir => satir.trim() !== "")
                    .map(satir => {
                        const kucukSatir = satir.toLocaleLowerCase('tr-TR');
                        const kelimeler = kucukSatir.split(/[^a-zA-ZçÇğĞıİöÖşŞüÜ0-9]+/);
                        return { orjinal: satir, kelimeler: kelimeler };
                    });

                durumEl.textContent = `Toplam ${tumVeriler.length} kayıt (gıda ve ilaç) hazır. Arama yapabilirsiniz.`;
                durumEl.classList.add("text-emerald-600", "font-medium");
            } catch (error) {
                console.error(error);
                durumEl.textContent = "Veriler yüklenirken bir hata oluştu. Dosya adlarını kontrol edin.";
                durumEl.classList.add("text-rose-500");
            }
        }

        verileriYukle();

        const aramaInput = document.getElementById("aramaInput");
        aramaInput.addEventListener("input", (e) => {
            const aranan = e.target.value.trim().toLocaleLowerCase('tr-TR');
            const sonucListesi = document.getElementById("sonucListesi");
            sonucListesi.innerHTML = "";

            if (aranan.length === 0) return;

            const eslesenler = [];
            for (let i = 0; i < tumVeriler.length; i++) {
                if (tumVeriler[i].kelimeler.includes(aranan)) {
                    eslesenler.push(tumVeriler[i].orjinal);
                    if (eslesenler.length >= 50) break;
                }
            }

            if (eslesenler.length === 0) {
                sonucListesi.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow-sm text-center text-slate-500 border border-slate-100">
                        Aradığınız kriterlere uygun sonuç bulunamadı.
                    </div>`;
                return;
            }

            let htmlIcerik = "";
            eslesenler.forEach(item => {
                htmlIcerik += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between hover:border-emerald-300 transition-all">
                        <span class="font-medium text-slate-700">${item}</span>
                        <span class="text-xs bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full font-semibold">Güvenli / Uygun</span>
                    </div>`;
            });
            sonucListesi.innerHTML = htmlIcerik;
        });
    </script>
</body>
</html>
