<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çölyak Gıda ve İlaç Arama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-line;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #e2e3e5; color: #383d41; }
        .category-title { font-weight: bold; margin-top: 10px; display: block; color: #2c3e50; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Çölyak Güvenli Ürün & İlaç Sorgulama</h2>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ürün veya ilaç adı yazın..." onkeypress="handleKeyPress(event)">
        <button onclick="searchBothFiles()">Sorgula</button>
    </div>
    <div id="result" class="info">Veritabanları yükleniyor, lütfen bekleyin...</div>
</div>

<script>
    let urunlerData = [];
    let ilaclarData = [];

    // Sayfa açıldığında HEM urunler.csv HEM DE ilaclar.csv dosyalarını arka planda yüklüyoruz
    window.onload = async function() {
        try {
            const [urunResponse, ilacResponse] = await Promise.all([
                fetch('urunler.csv'),
                fetch('ilaclar.csv')
            ]);

            if (!urunResponse.ok || !ilacResponse.ok) {
                throw new Error("Dosyalardan biri veya ikisi okunamadı.");
            }

            const urunText = await urunResponse.text();
            const ilacText = await ilacResponse.text();

            urunlerData = urunText.split('\n').map(row => row.trim()).filter(row => row.length > 0);
            ilaclarData = ilacText.split('\n').map(row => row.trim()).filter(row => row.length > 0);

            document.getElementById('result').className = "info";
            document.getElementById('result').innerText = `Veritabanları hazır! Toplam ${urunlerData.length} ürün ve ${ilaclarData.length} ilaç kaydı taranmaya hazır.`;
        } catch (error) {
            document.getElementById('result').className = "error";
            document.getElementById('result').innerText = "⚠️ 'urunler.csv' veya 'ilaclar.csv' dosyaları yüklenirken hata oluştu. Dosya adlarını kontrol edin.";
        }
    };

    function searchBothFiles() {
        const input = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultDiv = document.getElementById('result');

        if (!input) {
            resultDiv.className = "error";
            resultDiv.innerText = "⚠️ Lütfen aranacak bir ürün veya ilaç adı girin.";
            return;
        }

        if (urunlerData.length === 0 && ilaclarData.length === 0) {
            resultDiv.className = "error";
            resultDiv.innerText = "⚠️ Veritabanları henüz yüklenmedi.";
            return;
        }

        // İki dosyada ayrı ayrı arama yapıyoruz
        const matchingUrunler = urunlerData.filter(row => row.toLowerCase().includes(input));
        const matchingIlaclar = ilaclarData.filter(row => row.toLowerCase().includes(input));

        let outputHTML = "";

        if (matchingUrunler.length > 0) {
            outputHTML += `<span class="category-title">🍞 Gıda / Ürün Sonuçları (${matchingUrunler.length}):</span>`;
            outputHTML += matchingUrunler.slice(0, 10).join('<br>') + "<br>";
        }

        if (matchingIlaclar.length > 0) {
            outputHTML += `<span class="category-title">💊 İlaç Sonuçları (${matchingIlaclar.length}):</span>`;
            outputHTML += matchingIlaclar.slice(0, 10).join('<br>') + "<br>";
        }

        if (outputHTML !== "") {
            resultDiv.className = "success";
            resultDiv.innerHTML = outputHTML;
        } else {
            resultDiv.className = "error";
            resultDiv.innerText = `❌ "${input.toUpperCase()}" veritabanlarında bulunamadı.`;
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            searchBothFiles();
        }
    }
</script>

</body>
</html>
