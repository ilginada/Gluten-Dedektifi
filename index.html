<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gluten-Dedektifi | Güvenli Ürün Arama</title>
    <!-- PapaParse kütüphanesi ile CSV dosyalarını kolayca okuyoruz -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --bg-color: #f7fafc;
            --text-color: #2d3748;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .search-box:focus {
            border-color: var(--primary-color);
        }
        .results-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .result-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .product-name {
            font-weight: 600;
        }
        .product-source {
            font-size: 12px;
            background: #edf2f7;
            padding: 4px 8px;
            border-radius: 4px;
            color: #4a5568;
        }
        .loading {
            text-align: center;
            color: #718096;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gluten-Dedektifi</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="Ürün veya marka ara..." oninput="filterProducts()">
        
        <div id="loading" class="loading">Veriler yükleniyor...</div>
        <ul id="resultsList" class="results-list"></ul>
    </div>

    <script>
        let allProducts = [];

        // CSV dosyalarını yükleme fonksiyonu
        async function loadDatasets() {
            try {
                // ayse.csv ve urunler.csv dosyalarınızı projeye göre buraya ekledik
                const files = ['ayse.csv', 'urunler.csv'];
                
                for (let file of files) {
                    const response = await fetch(file);
                    if (!response.ok) continue;
                    const csvText = await response.text();
