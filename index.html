<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Gıda ve İlaç Arama Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-900 shadow-sm py-6 px-4 text-white">
        <div class="max-w-2xl mx-auto text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-emerald-400">Çölyak Gıda ve İlaç Rehberi</h1>
            <p class="text-sm text-slate-300 mt-1">Gıda ve ilaçları tek noktadan hızlıca sorgulayın</p>
        </div>
    </header>

    <main class="max-w-2xl mx-auto w-full px-4 py-8 flex-grow">
        
        <div class="relative mb-6">
            <input 
                type="text" 
                id="aramaInput" 
                placeholder="Gıda veya ilaç adı yazın (Örn: Süt, Parol)..." 
                class="w-full px-4 py-3 pl-12 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-base bg-white"
                autofocus
            >
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                🔍
            </span>
        </div>

        <div id="durumMetni" class="text-center text-sm text-slate-500 mb-4">
            Veriler yükleniyor...
        </div>

        <div id="sonucListesi" class="space-y-3"></div>

    </main>

    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 mt-auto">
        GitHub Pages - Canlı Sistem
    </footer>

    <script>
        // Verileri önceden işlenmiş nesneler (object) olarak tutarak aramayı ışık hızına çıkarıyoruz
        let tumVeriler = [];

        async function verileriYukle() {
            const durumEl = document.getElementById("durumMetni");
            try {
                const timestamp = new Date().getTime();
                
                const [ilacResponse, gidaResponse] = await Promise.all([
                    fetch('ayse.csv?v=' + timestamp),
                    fetch('urunler.csv?v=' + timestamp).catch(() => null)
                ]);

                let birlesikVeri = [];

                if (ilacResponse && ilacResponse.ok) {
                    const ilacText = await ilacResponse.text();
                    birlesikVeri = birlesikVeri.concat(ilacText.split(/\r?\n/));
                }

                if (gidaResponse && gidaResponse.ok) {
                    const gidaText = await gidaResponse.text();
                    birlesikVeri = birlesikVeri.concat(gidaText.split(/\r?\n/));
                }

                // Arama performansını artırmak için veriyi 1 kere işliyoruz
                tumVeriler = birlesikVeri
                    .filter(satir => satir.trim() !== "")
                    .map(satir => {
                        const kucukSatir = satir.toLocaleLowerCase('tr-TR');
                        // Satırdaki kelimeleri sadece 1 kez ayırıp hafızaya alıyoruz
                        const kelimeler = kucukSatir.split(/[\s,\-\(\)]+/);
                        return { orjinal: satir, kelimeler: kelimeler };
                    });

                durumEl.textContent = `Toplam ${tumVeriler.length} kayıt yüklendi. Arama yapabilirsiniz.`;
            } catch (error) {
                console.error(error);
                durumEl.textContent = "Veriler yüklenirken bir hata oluştu!";
                durumEl.classList.add("text-rose-500");
            }
        }

        verileriYukle();

        const aramaInput = document.getElementById("aramaInput");
        
        aramaInput.addEventListener("input", (e) => {
            const aranan = e.target.value.trim().toLocaleLowerCase('tr-TR');
            const sonucListesi = document.getElementById("sonucListesi");
            sonucListesi.innerHTML = "";

            if (aranan.length === 0) return;

            // Hızlı Filtreleme: Önceden hazırlanmış kelime dizisinde tam eşleşme arar
            const eslesenler = [];
            for (let i = 0; i < tumVeriler.length; i++) {
                if (tumVeriler[i].kelimeler.includes(aranan)) {
                    eslesenler.push(tumVeriler[i].orjinal);
                    if (eslesenler.length >= 50) break; // İlk 50 sonuçta dur (performans artırır)
                }
            }

            if (eslesenler.length === 0) {
                sonucListesi.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow-sm text-center text-slate-500 border border-slate-100">
                        Aradığınız kriterlere uygun sonuç bulunamadı.
                    </div>`;
                return;
            }

            // HTML çıktılarını tek seferde ekrana bas (DOM yükünü hafifletir)
            let htmlIcerik = "";
            eslesenler.forEach(item => {
                htmlIcerik += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <span class="font-medium text-slate-700">${item}</span>
                        <span class="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full font-semibold">Uygun / Güvenli</span>
                    </div>`;
            });
            sonucListesi.innerHTML = htmlIcerik;
        });
    </script>
</body>
</html>
