<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Gıda ve İlaç Arama Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-900 shadow-sm py-6 px-4 text-white">
        <div class="max-w-2xl mx-auto text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-emerald-400">Çölyak Gıda ve İlaç Rehberi</h1>
            <p class="text-sm text-slate-300 mt-1">Güvenli ve tam kelime eşleşmeli arama asistanı</p>
        </div>
    </header>

    <main class="max-w-2xl mx-auto w-full px-4 py-8 flex-grow">
        
        <div class="relative mb-6">
            <input 
                type="text" 
                id="aramaInput" 
                placeholder="Ürün veya ilaç adı yazın (Örn: Efes)..." 
                class="w-full px-4 py-3 pl-12 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-base bg-white"
                autofocus
            >
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                🔍
            </span>
        </div>

        <div id="durumMetni" class="text-center text-sm text-slate-500 mb-4">
            Veriler yükleniyor...
        </div>

        <div id="sonucListesi" class="space-y-3"></div>

    </main>

    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 mt-auto">
        GitHub Pages - Canlı Sistem
    </footer>

    <script>
        let tumVeriler = [];

        async function veriYukle() {
            const durumEl = document.getElementById("durumMetni");
            try {
                // Tarayıcı önbelleğini engellemek için sonuna rastgele sayı ekliyoruz (?v=999)
                const response = await fetch('ayse.csv?v=' + new Date().getTime());
                if (!response.ok) throw new Error("CSV bulunamadı");
                
                const dataText = await response.text();
                tumVeriler = dataText.split(/\r?\n/).filter(satir => satir.trim() !== "");
                
                durumEl.textContent = `${tumVeriler.length} kayıt yüklendi. Arama yapabilirsiniz.`;
            } catch (error) {
                console.error(error);
                durumEl.textContent = "Veriler yüklenirken hata oluştu!";
                durumEl.classList.add("text-rose-500");
            }
        }

        veriYukle();

        const aramaInput = document.getElementById("aramaInput");
        aramaInput.addEventListener("input", (e) => {
            // Türkçe büyük/küçük harf sorununu çözmek için toLocaleLowerCase('tr-TR') kullanıyoruz
            const aranan = e.target.value.trim().toLocaleLowerCase('tr-TR');
            const sonucListesi = document.getElementById("sonucListesi");
            sonucListesi.innerHTML = "";

            if (aranan.length === 0) return;

            // KESİN ÇÖZÜM: Kelime kelime bölüp tam eşleşme arıyoruz
            const eslesenler = tumVeriler.filter(item => {
                const satirKucuk = item.toLocaleLowerCase('tr-TR');
                // Satırı boşluklar ve noktalama işaretlerine göre kelimelere ayır
                const kelimeler = satirKucuk.split(/[^a-zA-ZçÇğĞıİöÖşŞüÜ0-9]+/);
                
                // Aranan kelime, satırdaki kelimelerden BİRİYLE TAM OLANAK eşleşiyor mu?
                return kelimeler.includes(aranan);
            }).slice(0, 50);

            if (eslesenler.length === 0) {
                sonucListesi.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow-sm text-center text-slate-500 border border-slate-100">
                        Aradığınız kriterlere uygun sonuç bulunamadı.
                    </div>`;
                return;
            }

            eslesenler.forEach(item => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between";
                itemDiv.innerHTML = `
                    <span class="font-medium text-slate-700">${item}</span>
                    <span class="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full font-semibold">Uygun / Güvenli</span>
                `;
                sonucListesi.appendChild(itemDiv);
            });
        });
    </script>
</body>
</html>
