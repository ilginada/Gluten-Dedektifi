
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Çölyak Gıda ve İlaç Arama</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            max-height: 350px;
            overflow-y: auto;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background-color: #e2e3e5;
            color: #383d41;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Çölyak Güvenli Ürün & İlaç Sorgulama</h2>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Ürün veya marka adı yazın..."
        >

        <button id="searchButton">Sorgula</button>

    </div>

    <div id="result" class="info">
        Veritabanı yükleniyor, lütfen bekleyin...
    </div>

</div>

<script>

    "use strict";

    let csvData = [];

    const resultDiv = document.getElementById("result");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");

    // Veritabanını güvenli şekilde yükle
    async function loadDatabase() {

        try {

            const response = await fetch("urunler.csv");

            if (!response.ok) {
                throw new Error("CSV dosyası yüklenemedi");
            }

            const data = await response.text();

            csvData = data
                .split(/\r?\n/)
                .map(row => row.trim())
                .filter(row => row.length > 0);

            resultDiv.className = "info";

            resultDiv.textContent =
                "Veritabanı başarıyla yüklendi! Toplam " +
                csvData.length +
                " kayıt taranmaya hazır.";

        } catch (error) {

            resultDiv.className = "error";

            resultDiv.textContent =
                "⚠️ Veritabanı yüklenemedi. urunler.csv dosyasını kontrol edin.";

        }

    }

    // Güvenli ürün arama
    function searchCSV() {

        const input = searchInput.value.trim().toLocaleLowerCase("tr-TR");

        resultDiv.replaceChildren();

        if (!input) {

            resultDiv.className = "error";
            resultDiv.textContent =
                "⚠️ Lütfen aranacak bir ürün veya marka adı girin.";

            return;

        }

        if (csvData.length === 0) {

            resultDiv.className = "error";
            resultDiv.textContent =
                "⚠️ Veritabanı henüz yüklenmedi veya boş.";

            return;

        }

        const matches = csvData.filter(row =>
            row.toLocaleLowerCase("tr-TR").includes(input)
        );

        if (matches.length > 0) {

            resultDiv.className = "success";

            // innerHTML yerine güvenli DOM işlemleri
            const heading = document.createElement("strong");

            heading.textContent =
                "✅ " + matches.length + " sonuç bulundu:";

            resultDiv.appendChild(heading);

            matches.slice(0, 10).forEach(row => {

                const line = document.createElement("div");

                // CSV içeriğini HTML olarak çalıştırmaz
                line.textContent = row;

                resultDiv.appendChild(line);

            });

            if (matches.length > 10) {

                const more = document.createElement("small");

                more.textContent =
                    "...ve " + (matches.length - 10) +
                    " sonuç daha (ilk 10 tanesi gösteriliyor).";

                resultDiv.appendChild(more);

            }

        } else {

            resultDiv.className = "error";

            resultDiv.textContent =
                '❌ "' + input.toUpperCase() +
                '" veritabanında bulunamadı.';

        }

    }

    // Buton ile arama
    searchButton.addEventListener("click", searchCSV);

    // Enter tuşu ile arama
    searchInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            searchCSV();
        }

    });

    // Sayfa açıldığında veritabanını yükle
    window.addEventListener("DOMContentLoaded", loadDatabase);

</script>

</body>
</html>
